<body class="relative bg-surface text-on-surface select-none">
<!-- TopNavBar Implementation -->
<header class="flex justify-between items-center px-8 py-4 w-full z-50 bg-white dark:bg-slate-900 sticky top-0">

<button class="text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors px-3 py-1 rounded-lg">

<button class="text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors px-3 py-1 rounded-lg">

</button>
</nav>
<div class="h-12 w-12 rounded-full overflow-hidden border-2 border-primary-container">

<div class="px-8 mb-10">
<h2 class="text-xl font-bold font-headline text-on-surface">Registration</h2>
<p class="text-sm font-medium font-body text-slate-500">Step 2 of 4</p>
</div>
<div class="flex flex-col gap-2">
<div class="text-slate-500 dark:text-slate-400 ml-4 pl-4 py-4 flex items-center gap-4 transition-opacity">
<span class="material-symbols-outlined" data-icon="person">person</span>
<span class="font-medium font-body">Basic Info</span>
</div>
<div class="bg-green-100 dark:bg-green-900/30 text-green-800 dark:text-green-300 rounded-l-full ml-4 pl-4 py-4 flex items-center gap-4">

<div class="text-slate-500 dark:text-slate-400 ml-4 pl-4 py-4 flex items-center gap-4 transition-opacity">

</div>
<div class="text-slate-500 dark:text-slate-400 ml-4 pl-4 py-4 flex items-center gap-4 transition-opacity">
<span class="material-symbols-outlined" data-icon="task_alt">task_alt</span>
<span class="font-medium font-body">Confirmation</span>
</div>
</div>
<!-- AI Pulse Component -->
<div class="mt-auto px-8 pb-12 flex flex-col items-center">
<div class="relative w-24 h-24 mb-4">

<main class="ml-72 flex-1 p-12 relative overflow-hidden">
<div class="max-w-4xl mx-auto h-full flex flex-col">
<header class="mb-10">
<h1 class="text-4xl font-bold font-headline tracking-tight text-on-surface mb-2">How are you feeling?</h1>
<p class="text-lg text-on-surface-variant font-body">Please select the category that best describes your visit today.</p>
</header>
<!-- Touch-friendly Bento Grid -->
<div class="grid grid-cols-3 gap-6 mb-10">
<!-- General Checkup -->
<button class="bg-surface-container-lowest p-8 rounded-[2rem] border border-outline-variant/10 shadow-sm hover:bg-secondary-container transition-all group flex flex-col items-center text-center gap-4 active:scale-95">
<div class="w-16 h-16 rounded-full bg-primary-fixed flex items-center justify-center text-primary group-hover:bg-on-secondary">
<span class="material-symbols-outlined text-3xl" data-icon="stethoscope">stethoscope</span>
</div>
<div>
<h3 class="font-bold text-xl font-headline mb-1">General Checkup</h3>
<p class="text-sm text-on-surface-variant group-hover:text-on-secondary-container">Routine physical or screening</p>
</div>
</button>
<!-- Consultation -->
<button class="bg-surface-container-lowest p-8 rounded-[2rem] border border-outline-variant/10 shadow-sm hover:bg-secondary-container transition-all group flex flex-col items-center text-center gap-4 active:scale-95">
<div class="w-16 h-16 rounded-full bg-primary-fixed flex items-center justify-center text-primary group-hover:bg-on-secondary">
<span class="material-symbols-outlined text-3xl" data-icon="chat">chat</span>
</div>
<div>
<h3 class="font-bold text-xl font-headline mb-1">Consultation</h3>
<p class="text-sm text-on-surface-variant group-hover:text-on-secondary-container">Discussing specific health concerns</p>
</div>
</button>
<!-- Laboratory -->
<button class="bg-surface-container-lowest p-8 rounded-[2rem] border border-outline-variant/10 shadow-sm hover:bg-secondary-container transition-all group flex flex-col items-center text-center gap-4 active:scale-95">
<div class="w-16 h-16 rounded-full bg-primary-fixed flex items-center justify-center text-primary group-hover:bg-on-secondary">
<span class="material-symbols-outlined text-3xl" data-icon="biotech">biotech</span>
</div>
<div>
<h3 class="font-bold text-xl font-headline mb-1">Laboratory</h3>
<p class="text-sm text-on-surface-variant group-hover:text-on-secondary-container">Blood tests, X-rays, or imaging</p>
</div>
</button>
<!-- Emergency -->
<button class="bg-surface-container-lowest p-8 rounded-[2rem] border border-error-container/30 shadow-sm hover:bg-error-container transition-all group flex flex-col items-center text-center gap-4 active:scale-95">
<div class="w-16 h-16 rounded-full bg-error-container/50 flex items-center justify-center text-error group-hover:bg-error group-hover:text-white">
<span class="material-symbols-outlined text-3xl" data-icon="e911_emergency">e911_emergency</span>
</div>
<div>
<h3 class="font-bold text-xl font-headline mb-1">Emergency</h3>
<p class="text-sm text-on-surface-variant">Urgent care or acute injury</p>
</div>
</button>
<!-- Pharmacy -->
<button class="bg-surface-container-lowest p-8 rounded-[2rem] border border-outline-variant/10 shadow-sm hover:bg-secondary-container transition-all group flex flex-col items-center text-center gap-4 active:scale-95">
<div class="w-16 h-16 rounded-full bg-primary-fixed flex items-center justify-center text-primary group-hover:bg-on-secondary">
<span class="material-symbols-outlined text-3xl" data-icon="medication">medication</span>
</div>
<div>
<h3 class="font-bold text-xl font-headline mb-1">Pharmacy</h3>
<p class="text-sm text-on-surface-variant group-hover:text-on-secondary-container">Prescription refills or pickups</p>
</div>
</button>
<!-- Follow-up -->
<button class="bg-surface-container-lowest p-8 rounded-[2rem] border border-outline-variant/10 shadow-sm hover:bg-secondary-container transition-all group flex flex-col items-center text-center gap-4 active:scale-95">
<div class="w-16 h-16 rounded-full bg-primary-fixed flex items-center justify-center text-primary group-hover:bg-on-secondary">
<span class="material-symbols-outlined text-3xl" data-icon="event_repeat">event_repeat</span>
</div>
<div>
<h3 class="font-bold text-xl font-headline mb-1">Follow-up</h3>
<p class="text-sm text-on-surface-variant group-hover:text-on-secondary-container">Scheduled post-visit check</p>
</div>
</button>
</div>
<!-- Additional Details -->
<div class="flex-1 flex flex-col gap-4">
<label class="text-lg font-bold font-headline text-on-surface ml-2">Additional details</label>
<textarea class="w-full h-40 bg-surface-container-low rounded-[1.5rem] border-none focus:ring-2 focus:ring-primary/20 focus:bg-surface-container-lowest p-6 text-lg font-body text-on-surface placeholder:text-outline/60 resize-none transition-all shadow-inner" placeholder="Please describe any other symptoms or specific notes you have..."></textarea>
</div>
</div>
</main>
